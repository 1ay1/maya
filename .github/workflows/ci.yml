name: ci

# Build maya and RUN ITS TEST SUITE on every push / PR across the three
# supported toolchains. This is the correctness gate the project was missing.
#
# Jobs:
#   build-test   — gcc-16 / clang-22 build all tests + ctest; MSVC builds the
#                  library only (the test harness mocks terminal fds with POSIX
#                  open()/pipe()/forkpty(), which MSVC lacks — the suite runs on
#                  the POSIX legs).
#
#                  TOOLCHAIN FLOOR: maya::app vendors jaal, and jaal needs
#                  C++26 structured binding packs (P1061) to see inside a
#                  struct for its Sendable/Frozen checks — without them
#                  jaal/meta/fields.hpp is a hard #error. P1061 landed in
#                  GCC 16 and clang 22, so gcc-14/clang-19 can no longer
#                  build this repo at all. Neither is in the runner image:
#                  g++-16 comes from ubuntu-toolchain-r/test, clang-22 from
#                  apt.llvm.org. Do not lower these without also setting
#                  -DMAYA_BUILD_APP=OFF.
#   sanitizers   — ASan+UBSan and TSan (clang-22), the parser/writer/render
#                  path is the most exposed to adversarial bytes. Clang's
#                  sanitizer runtimes are the reference implementation; gcc
#                  also ICEs building reveal_fx.cpp under -fsanitize=address.
#   fuzz-smoke   — build the libFuzzer harnesses and run each for a few
#                  seconds (a real fuzzing run is a scheduled job, see fuzz.yml).

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build+test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc16
            os: ubuntu-latest
            cc: gcc-16
            cxx: g++-16
          - name: linux-clang22
            os: ubuntu-latest
            cc: clang-22
            cxx: clang++-22
          - name: macos-gcc
            os: macos-14
            cc: gcc-16
            cxx: g++-16
          - name: windows-msvc
            os: windows-2025
            cc: ""
            cxx: ""
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          if [ "${{ matrix.cc }}" = "clang-22" ]; then
            # clang-22 from apt.llvm.org — the first clang with P1061, which
            # jaal requires. Keep the runner's preinstalled cmake (apt's 3.28
            # doesn't recognise cxx_std_26 for clang; maya probes -std=c++2c
            # directly anyway). libstdc++-16 supplies the matching headers.
            wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
            chmod +x /tmp/llvm.sh
            sudo /tmp/llvm.sh 22
            # libstdc++-16 lives in the same PPA as g++-16.
            sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
            sudo apt-get update
            sudo apt-get install -y clang-tools-22 libstdc++-16-dev ninja-build
          else
            # g++-16 is not in the runner image; ubuntu-toolchain-r/test has it.
            sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
            sudo apt-get update
            sudo apt-get install -y g++-16 cmake ninja-build
          fi

      - name: Install toolchain (macOS)
        if: runner.os == 'macOS'
        run: |
          # gcc@16 for P1061 (jaal). Homebrew installs it as g++-16 on PATH.
          brew install gcc@16 cmake ninja || true

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        uses: seanmiddleditch/gha-setup-ninja@v6

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        shell: bash
        run: |
          export CC="${{ matrix.cc }}" CXX="${{ matrix.cxx }}"
          # The test harness mocks a real terminal fd with POSIX
          # open()/pipe()/forkpty(), so the test executables only build on
          # Linux/macOS. On Windows we verify the C++26 LIBRARY itself compiles
          # under MSVC; the full suite runs on the POSIX legs (gcc + clang).
          if [ "$RUNNER_OS" = "Windows" ]; then TESTS=OFF; else TESTS=ON; fi
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DMAYA_BUILD_TESTS=$TESTS \
            -DMAYA_BUILD_EXAMPLES=OFF \
            -DMAYA_NATIVE_TUNING=OFF

      - name: Build
        run: cmake --build build -j

      - name: Test
        if: runner.os != 'Windows'
        # Exclude perf-labelled benchmarks: they assert on SPEED, which varies
        # with shared-runner load, so they flake the pass/fail gate. Correctness
        # tests (incl. the markdown watchdogs) still run.
        run: ctest --test-dir build --output-on-failure --timeout 120 -LE perf

  # Every example, built on each OS (Windows included: jaal has a Windows
  # reactor, and the host must compile against it), then driven in a real
  # pty on the POSIX legs: draw, react, animate, resize, no idle spin, quit
  # cleanly, every navigation key drawn.
  examples:
    name: examples (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-clang19
            os: ubuntu-latest
          - name: macos
            os: macos-14
          - name: windows-msvc
            os: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 22
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y libstdc++-16-dev ninja-build
          pip3 install --break-system-packages pyte
          echo "CC=clang-22"   >> "$GITHUB_ENV"
          echo "CXX=clang++-22" >> "$GITHUB_ENV"
      - name: Install toolchain (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja && pip3 install --break-system-packages pyte
      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        uses: seanmiddleditch/gha-setup-ninja@v6
      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        run: >
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DMAYA_BUILD_TESTS=OFF -DMAYA_BUILD_EXAMPLES=ON
          -DMAYA_EXAMPLES_ALL=ON -DMAYA_NATIVE_TUNING=OFF
      - name: Build
        run: cmake --build build -j
      - name: Drive every example in a real pty
        if: runner.os != 'Windows'
        run: |
          sh tests/smoke_all.sh build
          python3 tests/smoke.py build/maya_doomfire2 --keys=12 --animates=1

  sanitizers:
    name: sanitizers (${{ matrix.san }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        san: ["address,undefined", "thread"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install toolchain
        run: |
          sudo apt-get update
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 22
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y clang-tools-22 libstdc++-16-dev ninja-build
      - name: Configure with sanitizer
        env:
          CC: clang-22
          CXX: clang++-22
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DMAYA_BUILD_TESTS=ON \
            -DMAYA_BUILD_EXAMPLES=OFF \
            -DMAYA_NATIVE_TUNING=OFF \
            -DCMAKE_CXX_FLAGS="-fsanitize=${{ matrix.san }} -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=${{ matrix.san }}"
      - name: Build
        run: cmake --build build -j
      - name: Test under sanitizer
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          TSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build --output-on-failure --timeout 240 -LE perf

  fuzz-smoke:
    name: fuzz harness smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install clang
        run: |
          sudo apt-get update
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 22
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y clang-tools-22 libstdc++-16-dev ninja-build
      - name: Build fuzzers
        env:
          CC: clang-22
          CXX: clang++-22
        run: |
          cmake -B fuzzbuild -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DMAYA_BUILD_FUZZERS=ON \
            -DMAYA_NATIVE_TUNING=OFF
          cmake --build fuzzbuild -j
      - name: Run each fuzzer briefly
        run: |
          for f in fuzzbuild/fuzz/fuzz_*; do
            [ -x "$f" ] || continue
            echo "::group::$(basename "$f")"
            "$f" -max_total_time=20 -timeout=5 -rss_limit_mb=2048
            echo "::endgroup::"
          done
